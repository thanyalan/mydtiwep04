<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanyalan Profile 2026</title>
    <!-- เรียกใช้งานฟอนต์ Roboto Mono จาก Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet" />

    <style>
        /* กำหนดค่าเริ่มต้นของทุกองค์ประกอบให้มีขนาดและระยะห่างที่ควบคุมได้ง่ายขึ้น */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* กำหนดโครงสร้างหลักของหน้าเว็บไซต์ */

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #333333;
            font-family: "Roboto Mono", monospace;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* MAIN CONTENT พื้นที่หลักสำหรับข้อมูลแนะนำตัวและผลงานทั้งหมด */

        .hero {
            width: 100%;
            max-width: 1450px;
            margin: 0 auto;
            padding: 55px 45px 35px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 24px;
            flex: 1;
        }

        /* INTRODUCTION SECTION ส่วนแนะนำตัวและคำอธิบายของเว็บไซต์ */

        .sec-1 {
            min-width: 0;
            display: flex;
            flex-direction: column;
            padding: 10px 15px 0 5px;
        }

        /* ชื่อหัวข้อหลักของ Portfolio */

        .sec-1 h1 {
            font-size: clamp(2.2rem, 4vw, 4rem);
            line-height: 1.15;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -2px;
        }

        /* ข้อความแนะนำใต้หัวข้อ */

        .sec-1 p {
            max-width: 520px;
            font-size: clamp(0.9rem, 1.4vw, 1.05rem);
            line-height: 1.8;
            margin-bottom: 28px;
            color: #ffffff;
        }

        /* FOLLOW BUTTON ปุ่มสำหรับการโต้ตอบกับผู้เข้าชมเว็บไซต์ */

        .btn-follow {
            width: fit-content;
            padding: 13px 32px;
            background: #242121;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 50px;
            font-family: "Roboto Mono", monospace;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition:
                background-color 0.3s ease,
                color 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;
            margin-bottom: 35px;
        }

        /* เอฟเฟกต์เมื่อเลื่อนเมาส์ไปบนปุ่ม */

        .btn-follow:hover {
            background: #9dbbc5;
            color: #222;
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
        }

        /* SMALL PROJECT PREVIEWแสดงตัวอย่างเว็บไซต์ 2 ผลงานในส่วนด้านล่าง*/

        .bottom-cards {
            display: flex;
            gap: 18px;
            width: 100%;
            margin-top: auto;
            min-height: 250px;
        }

        /* PROJECT CARD กล่องสำหรับแสดง Preview ของแต่ละเว็บไซต์ */

        .img-link {
            position: relative;
            display: block;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border: 2px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0);
            border-radius: 18px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.10);
            transition:
                transform 0.35s ease,
                box-shadow 0.35s ease;
        }

        /* ทำให้การ์ดดูยกขึ้นเมื่อ Hover */

        .img-link:hover {
            transform: translateY(-8px);
            box-shadow:
                0 18px 35px rgba(0, 0, 0, 0.20);
        }

        /* WEBSITE PREVIEW ย่อหน้าเว็บที่อยู่ภายใน iframe ให้สามารถแสดงเป็น Preview */

        .card-iframe,
        .mockup-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 400%;
            height: 400%;
            border: none;
            transform: scale(0.25);
            transform-origin: top left;
            pointer-events: none;
        }

        /* LARGE PROJECT COLUMNS คอลัมน์สำหรับแสดงผลงาน Portfolio และ Bake House */

        .sec-2,
        .sec-3 {
            min-width: 0;
            display: flex;
            align-items: stretch;
        }

        /* กำหนดขนาดของ Preview ผลงานด้านขวา */

        .sec-2 .img-link,
        .sec-3 .img-link {
            width: 100%;
            min-height: 600px;
        }

        /* FOOTER ข้อมูลลิขสิทธิ์และรายละเอียดท้ายเว็บไซต์ */

        .footer {
            width: 100%;
            padding: 18px 20px 22px;
            text-align: center;
            background: #1d1d1d;
            color: #ffffff;
            font-size: 0.78rem;
            line-height: 1.8;
        }

        .footer p {
            margin: 3px 0;
        }

        /* TABLET RESPONSIVE ปรับการจัดวางสำหรับหน้าจอขนาดกลาง */

        @media (max-width: 1100px) {
            .hero {
                grid-template-columns: 1fr 1fr;

                padding: 40px 30px;
            }

            .sec-1 {
                grid-column: 1 / -1;

                padding: 0;
            }

            .sec-1 p {
                max-width: 700px;
            }

            .sec-2 .img-link,
            .sec-3 .img-link {
                min-height: 520px;
            }
        }

        /* MOBILE RESPONSIVE เปลี่ยนเป็นการเรียงเนื้อหาแนวตั้งสำหรับโทรศัพท์ */

        @media (max-width: 700px) {

            body {
                overflow-x: hidden;
            }

            .hero {
                display: flex;
                flex-direction: column;
                gap: 25px;
                padding: 35px 20px 25px;
            }

            /* ปรับขนาดหัวข้อให้เหมาะกับมือถือ */

            .sec-1 h1 {
                font-size: clamp(2rem, 10vw, 3rem);
                letter-spacing: -1px;
            }

            .sec-1 p {
                font-size: 0.9rem;
                line-height: 1.7;
            }

            /* เปลี่ยนการ์ดด้านล่างให้เรียงเป็นแนวตั้ง */

            .bottom-cards {
                flex-direction: column;
                min-height: auto;
                gap: 18px;
                margin-top: 10px;
            }

            .bottom-cards .img-link {
                height: 250px;
            }

            /* กำหนดความสูงของ Preview ผลงานบนมือถือ */

            .sec-2 .img-link,
            .sec-3 .img-link {
                height: 420px;
                min-height: 420px;
            }


            .footer {
                font-size: 0.7rem;
                padding: 16px 15px 20px;
            }
        }

        /* SMALL MOBILEปรับรายละเอียดเพิ่มเติมสำหรับหน้าจอที่มีความกว้างน้อย */

        @media (max-width: 420px) {
            .hero {
                padding-left: 15px;
                padding-right: 15px;
            }

            .sec-1 h1 {
                font-size: 2rem;
            }

            .btn-follow {
                width: 100%;
            }

            .bottom-cards .img-link {
                height: 220px;
            }

            .sec-2 .img-link,
            .sec-3 .img-link {
                height: 350px;
                min-height: 350px;
            }
        }
    </style>
</head>

<body>

    <!-- MAIN PORTFOLIO AREA ส่วนหลักของหน้า Profile และผลงานทั้งหมด-->

    <div class="hero">

        <!--PROFILE INTRODUCTION ส่วนแนะนำเว็บไซต์และข้อมูลเจ้าของผลงาน-->

        <div class="sec-1">
            <h1>
                My Web Design by
                <br>
                HTML CSS
            </h1>

            <p>
                Lorem ipsum dolor sit amet,
                <br>
                consectetur adipiscing elit.
                <br>
                Cursus imperdiet sed id elementum.
                <br>
                Quam vel aliquam sit vulputate.
            </p>

            <!-- ปุ่มสำหรับสร้าง Interaction กับผู้เข้าชม -->
            <button class="btn-follow">
                Follow Me
            </button>

            <!--PROJECT PREVIEW ตัวอย่างผลงานขนาดเล็กจำนวน 2 ชิ้น-->

            <div class="bottom-cards">

                <!-- ผลงานหน้า Freelance Web Developer -->

                <a href="page_a.html" target="_blank" class="img-link" style="flex: 1;"
                    title="ดูหน้า Freelance Web Developer">
                    <iframe src="page_a.html" class="card-iframe" scrolling="no"></iframe>
                </a>

                <!-- ผลงานหน้า Profile Partner -->

                <a href="page_b.html" target="_blank" class="img-link" style="flex: 1;" title="ดูหน้า Profile Partner">
                    <iframe src="page_b.html" class="card-iframe" scrolling="no"></iframe>
                </a>
            </div>
        </div>

        <!--PORTFOLIO PROJECT แสดงตัวอย่างผลงาน Portfolio UI-->

        <div class="sec-2">
            <a href="page_c.html" target="_blank" class="img-link" style="width: 100%;" title="ดูหน้า Portfolio UI">
                <iframe src="page_c.html" class="mockup-iframe" scrolling="no"></iframe>
            </a>
        </div>


        <!--BAKE HOUSE PROJECT แสดงตัวอย่างผลงานเว็บไซต์ Bake House-->

        <div class="sec-3">
            <a href="page_d.html" target="_blank" class="img-link" style="width: 100%;" title="ดูหน้า Bake House">
                <iframe src="page_d.html" class="mockup-iframe" scrolling="no"></iframe>
            </a>
        </div>
    </div>

    <!-- FOOTER INFORMATION ข้อมูลการใช้งานเว็บไซต์และลิขสิทธิ์ -->

    <div class="footer">

        <p>
            (เว็บไซต์และผลงานทั้งหมดใช้เพื่อการศึกษาเท่านั้น)
        </p>
        <p>
            Created by Thanyalan Pimpuan SAU
        </p>
        <p>
            Copyright &copy; 2026 WoW WoW WoW
        </p>

    </div>
</body>

</html>
